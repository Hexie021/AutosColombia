<div class="page-shell">
  <header class="site-header">
    <div class="header-top">
      <a class="brand" routerLink="/control-acceso">
        <span class="brand-mark">P</span><span>Autos Colombia</span>
      </a>
      @if (operador(); as cuenta) {
        <div class="operator"><strong>{{ cuenta.nombre }}</strong><span>Operador</span></div>
      }
    </div>
    <nav aria-label="Navegación principal">
      <a routerLink="/control-acceso" routerLinkActive="active">Entrada y salida de vehículos</a>
      @if (operador()) {
        <a routerLink="/gestion/pagos" routerLinkActive="active">Pagos</a>
        <a routerLink="/gestion/celdas" routerLinkActive="active">Gestión de celdas</a>
        <div class="account-actions">
          <a routerLink="/mi-cuenta" routerLinkActive="active">Mi cuenta</a>
          <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
        </div>
      }
    </nav>
    @if (errorSalida()) { <p role="alert">{{ errorSalida() }}</p> }
  </header>
  <main><router-outlet /></main>
  <footer>
    <span>Autos Colombia · Parqueadero por mensualidad</span
    ><span>Operación · Colombia (UTC−5)</span>
  </footer>
</div>
